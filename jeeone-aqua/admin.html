<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JeeOne Aqua — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1E5A3C; --green-dark:#123C28; --green-light:#e8f5ee;
  --gold:#C9A227; --gold-light:#faf3dd;
  --bg:#f4f6f8; --surface:#ffffff; --border:#e6eaee;
  --text:#101828; --text-2:#475467; --text-3:#98a2b3;
  --red:#d92d20; --red-bg:#fef3f2; --blue:#175cd3; --blue-bg:#eff8ff;
  --amber:#dc6803; --amber-bg:#fffaeb; --success:#027a48; --success-bg:#ecfdf3;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
  --shadow-lg:0 12px 32px -8px rgba(16,24,40,.18);
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#d0d5dd;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ============ LOGIN ============ */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:radial-gradient(1200px 600px at 20% -10%,#1E5A3C 0%,#123C28 55%,#0b241a 100%);position:relative;overflow:hidden}
#login::before{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.14) 0%,transparent 70%);top:-150px;right:-100px}
#login::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.08) 0%,transparent 70%);bottom:-120px;left:-80px}
.login-card{position:relative;z-index:1;background:var(--surface);padding:40px 34px;border-radius:22px;box-shadow:var(--shadow-lg);width:380px;max-width:94vw;animation:rise .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.login-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.login-logo .drop{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--green-dark));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(30,90,60,.35)}
.login-card h1{font-size:23px;font-weight:800;color:var(--green-dark);letter-spacing:-.3px}
.login-card .sub{text-align:center;color:var(--text-3);margin:6px 0 26px;font-size:13px;font-weight:500;letter-spacing:.4px;text-transform:uppercase}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input{width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:11px;font-size:15px;outline:none;transition:.2s;background:#fcfcfd;font-family:inherit}
.field input:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 4px rgba(30,90,60,.08)}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:48px}
.pass-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:9px;color:var(--text-3)}
.pass-toggle:hover{background:#f2f4f7;color:var(--text-2)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:.2s;box-shadow:0 4px 14px rgba(30,90,60,.3)}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(30,90,60,.4)}
.login-btn:active{transform:scale(.98)}
#loginErr{display:none;margin-top:12px;padding:10px 14px;background:var(--red-bg);color:var(--red);border-radius:9px;font-size:13px;font-weight:500;text-align:center}

/* ============ SHELL ============ */
#app{display:none;min-height:100vh}
.topbar{background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;padding:0 18px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(18,60,40,.25)}
.topbar .brand{display:flex;align-items:center;gap:11px}
.topbar .brand .drop{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.topbar .brand .t1{font-size:17px;font-weight:800;letter-spacing:-.2px}
.topbar .brand .t1 span{color:var(--gold)}
.topbar .brand .t2{font-size:11px;opacity:.65;font-weight:500;letter-spacing:.6px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:10px}
.admin-badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);padding:7px 13px 7px 8px;border-radius:99px;font-size:13px;font-weight:600}
.admin-badge .avatar{width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.logout-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 16px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s;font-family:inherit}
.logout-btn:hover{background:rgba(255,255,255,.2)}

/* ============ LAYOUT ============ */
.shell{display:flex;min-height:calc(100vh - 62px)}
.sidenav{display:none}
@media(min-width:960px){
  .sidenav{display:block;width:248px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:62px;height:calc(100vh - 62px);overflow-y:auto}
  .sidenav .nav-label{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.8px;padding:14px 14px 8px}
  .sidenav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border:none;background:none;font-size:14px;cursor:pointer;color:var(--text-2);border-radius:10px;font-weight:500;font-family:inherit;transition:.15s;margin-bottom:2px}
  .sidenav button svg{width:19px;height:19px;flex-shrink:0;opacity:.75}
  .sidenav button:hover{background:#f2f4f7;color:var(--text)}
  .sidenav button.active{background:var(--green-light);color:var(--green-dark);font-weight:700}
  .sidenav button.active svg{opacity:1;color:var(--green)}
}
.page{flex:1;padding:22px 18px 100px;max-width:1160px;margin:0 auto;width:100%}
@media(min-width:960px){.page{padding:28px 30px 40px}}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.page-head h2{font-size:21px;font-weight:800;letter-spacing:-.3px;color:var(--text)}
.page-head p{font-size:13px;color:var(--text-3);margin-top:2px}

/* ============ STAT CARDS ============ */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden;transition:.2s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--green)}
.stat.gold::before{background:var(--gold)}
.stat .icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stat .icon.g{background:var(--green-light);color:var(--green)}
.stat .icon.y{background:var(--gold-light);color:#92690e}
.stat .icon svg{width:20px;height:20px}
.stat .num{font-size:25px;font-weight:800;letter-spacing:-.5px}
.stat .lbl{font-size:12.5px;color:var(--text-3);font-weight:500;margin-top:2px}
.stat .trend{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-block;padding:2px 8px;border-radius:99px}
.trend.up{background:var(--success-bg);color:var(--success)}
.trend.down{background:var(--red-bg);color:var(--red)}

/* ============ CARDS & TABLES ============ */
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;margin-bottom:18px}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.panel-head h3{font-size:15px;font-weight:700}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
thead th{background:#f9fafb;color:var(--text-2);padding:12px 16px;text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid var(--border)}
tbody td{padding:13px 16px;border-bottom:1px solid #f2f4f7;font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:#fafbfc}
.cell-main{font-weight:600;color:var(--text)}
.cell-sub{font-size:12px;color:var(--text-3);margin-top:1px}

/* ============ BADGES & BUTTONS ============ */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-green{background:var(--success-bg);color:var(--success)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-grey{background:#f2f4f7;color:var(--text-2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:.15s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(30,90,60,.25)}
.btn-primary:hover{background:var(--green-dark)}
.btn-ghost{background:#f2f4f7;color:var(--text-2)}
.btn-ghost:hover{background:#e4e7ec}
.btn-danger-soft{background:var(--red-bg);color:var(--red)}
.btn-danger-soft:hover{background:#fee4e2}
.btn-blue-soft{background:var(--blue-bg);color:var(--blue)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
.action-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:200px;max-width:340px}
.search-box input{width:100%;padding:10px 14px 10px 40px;border:1.5px solid var(--border);border-radius:10px;font-size:13.5px;outline:none;font-family:inherit;background:var(--surface)}
.search-box input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(30,90,60,.08)}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--text-3)}

/* ============ BOTTOM NAV ============ */
.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);z-index:100;padding-bottom:env(safe-area-inset-bottom);overflow-x:auto;box-shadow:0 -4px 20px rgba(16,24,40,.06)}
.bottomnav::-webkit-scrollbar{display:none}
.bottomnav button{flex:1;min-width:62px;border:none;background:none;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-3);font-size:10px;font-weight:600;font-family:inherit;transition:.15s}
.bottomnav button svg{width:22px;height:22px}
.bottomnav button.active{color:var(--green)}
.bottomnav button.active svg{transform:scale(1.1)}
@media(min-width:960px){.bottomnav{display:none}}

/* ============ MODAL ============ */
.modal{display:none;position:fixed;inset:0;background:rgba(16,24,40,.55);backdrop-filter:blur(3px);z-index:300;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
@media(min-width:700px){.modal{align-items:center;padding:20px}}
.modal-box{background:var(--surface);border-radius:22px 22px 0 0;padding:26px 22px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;animation:slideUp .28s cubic-bezier(.2,.9,.3,1.1)}
@media(min-width:700px){.modal-box{border-radius:20px}}
@keyframes slideUp{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
.modal-box h3{font-size:17px;font-weight:800;margin-bottom:4px}
.modal-box .m-sub{font-size:13px;color:var(--text-3);margin-bottom:16px}
.mrow2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-btns{display:flex;gap:10px;margin-top:22px}
.modal-btns .btn{flex:1;padding:13px;justify-content:center;font-size:14px;border-radius:11px}

/* ============ TOAST ============ */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:12px 22px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:400;box-shadow:var(--shadow-lg);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.success{background:var(--success)}
#toast.error{background:var(--red)}
@media(min-width:960px){#toast{bottom:30px}}

/* ============ MISC ============ */
.tab{display:none}.tab.active{display:block;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.empty{padding:44px 20px;text-align:center;color:var(--text-3)}
.empty svg{width:44px;height:44px;opacity:.3;margin-bottom:10px}
.empty p{font-size:14px;font-weight:500}
.skel{background:linear-gradient(90deg,#f2f4f7 25%,#e4e7ec 50%,#f2f4f7 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:8px}
@keyframes shimmer{to{background-position:-200% 0}}
select.input,select.stsel{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;background:var(--surface);font-family:inherit;outline:none;cursor:pointer;max-width:150px}
select.input:focus{border-color:var(--green)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--green-light);color:var(--green);margin:2px}
.settings-card{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.settings-card h3{font-size:14.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.settings-card h3 svg{width:17px;height:17px;color:var(--green)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f2f4f7}
.toggle-row:last-child{border:none}
.toggle-row .t{font-size:14px;font-weight:500}
.toggle-row .d{font-size:12px;color:var(--text-3)}
.switch{position:relative;width:48px;height:28px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#d0d5dd;border-radius:28px;cursor:pointer;transition:.25s}
.slider:before{position:absolute;content:"";height:22px;width:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider:before{transform:translateX(20px)}
.progress{height:7px;background:#f2f4f7;border-radius:99px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#2d7a4f);transition:width .5s}
.avatar-sm{width:34px;height:34px;border-radius:10px;background:var(--green-light);color:var(--green);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-right:10px;vertical-align:middle}
.price{font-weight:700;font-size:14px}
.low-stock{color:var(--red);font-weight:700}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="login-logo">
      <div class="drop"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12 2s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></div>
      <h1>JeeOne Aqua</h1>
    </div>
    <div class="sub">Admin Console</div>
    <div class="field"><label>Username</label><input type="text" id="u" placeholder="Enter username" autocomplete="off"></div>
    <div class="field"><label>Password</label>
      <div class="pass-wrap">
        <input type="password" id="p" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
        <button type="button" class="pass-toggle" onclick="togglePass()" id="passToggle"></button>
      </div>
    </div>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div id="loginErr">Invalid username or password</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="drop"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></div>
      <div><div class="t1">JeeOne <span>Aqua</span></div><div class="t2">Admin Console</div></div>
    </div>
    <div class="topbar-right">
      <div class="admin-badge"><div class="avatar">A</div><span>Admin</span></div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="shell">
    <div class="sidenav" id="sidenav"></div>
    <div class="page" id="page"></div>
  </div>
  <div class="bottomnav" id="bottomnav"></div>
</div>

<div class="modal" id="genModal"><div class="modal-box"><h3 id="gmTitle"></h3><div class="m-sub" id="gmSub"></div><div id="gmBody"></div><div class="modal-btns"><button class="btn btn-primary" id="gmSave">Save</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div></div></div>
<div id="toast"></div>

<script>
const API = location.pathname.includes('/jeeone') ? '/jeeone/api' : '/api';
let TOKEN = localStorage.getItem('jeeone_admin_token') || '';
const H = () => ({'Content-Type':'application/json','Authorization':'Bearer '+TOKEN});
const $ = id => document.getElementById(id);

/* ---------- SVG ICONS ---------- */
const I = (p, s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS = {
  dash: I('<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>'),
  box: I('<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22" x2="12" y2="12"/>'),
  cart: I('<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>'),
  refresh: I('<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>'),
  clock: I('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'),
  bike: I('<circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"/>'),
  clip: I('<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>'),
  tag: I('<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>'),
  image: I('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>'),
  users: I('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'),

/* ---------- API ---------- */
async function api(path, method='GET', body){
  const r = await fetch(API+path,{method,headers:H(),body:body?JSON.stringify(body):undefined});
  const j = await r.json();
  if(j.error==='Auth required'){logout();throw new Error('auth');}
  return j;
}
function toast(msg, type=''){
  const t=$('toast'); t.textContent=msg; t.className='show '+type;
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.className='',2600);
}

/* ---------- AUTH ---------- */
function togglePass(){const p=$('p'),t=$('passToggle');if(p.type==='password'){p.type='text';t.innerHTML=ICONS.eyeOff;}else{p.type='password';t.innerHTML=ICONS.eye;}}
async function doLogin(){
  const u=$('u').value,p=$('p').value; $('loginErr').style.display='none';
  try{const j=await api('/admin/login','POST',{username:u,password:p});
    if(j.ok){TOKEN=j.data.token;localStorage.setItem('jeeone_admin_token',TOKEN);init();}
    else $('loginErr').style.display='block';
  }catch(e){$('loginErr').style.display='block';}
}
function logout(){localStorage.removeItem('jeeone_admin_token');TOKEN='';location.reload();}
function closeModal(){$('genModal').classList.remove('show');}
function openModal(title, sub, bodyHtml, onSave){
  $('gmTitle').textContent=title; $('gmSub').textContent=sub||'';

  $('genModal').classList.add('show');
}

function badge(text, cls){

    async()=>{
      const imgList=gv('pf_images').split('\n').map(s=>s.trim()).filter(Boolean);

// preload stock into product objects for edit
async function rProducts(){
  const pg=$('page');
  pg.innerHTML=pageHead('Products','Manage your catalogue',
    `<div class="search-box">${ICONS.search}<input id="pq" placeholder="Search products..." oninput="filterRows('prodRows',this.value)"></div><button class="btn btn-primary" onclick="prodForm()">${ICONS.plus} Add Product</button>`)+skeletonRows();

  pg.innerHTML=pageHead('Products',`${ps.length} products in catalogue`,
    `<div class="search-box">${ICONS.search}<input id="pq" placeholder="Search products..." oninput="filterRows('prodRows',this.value)"></div><button class="btn btn-primary" onclick="prodForm()">${ICONS.plus} Add Product</button>`)+`

    const it=inv.find(x=>x.productId===p.id); const st=it?it.stock:'—'; const disc=p.mrp>p.price?Math.round((1-p.price/p.mrp)*100):0;

    <td><span class="price">₹${(+p.price||0).toLocaleString('en-IN')}</span>${p.mrp>p.price?`<br><span class="cell-sub"><s>₹${(+p.mrp).toLocaleString('en-IN')}</s> <span style="color:var(--success);font-weight:700">${disc}% off</span></span>`:''}</td>

    <td style="text-align:right;white-space:nowrap"><button class="btn btn-blue-soft btn-sm" onclick="prodForm('${p.id}')">Edit</button> <button class="btn btn-danger-soft btn-sm" onclick="delProd('${p.id}')">Delete</button></td></tr>`;}).join('')||''}</tbody></table>

/* ---------- INVENTORY ---------- */
async function rInv(){
  const pg=$('page'); pg.innerHTML=pageHead('Inventory','Track stock levels',`<button class="btn btn-primary" onclick="invForm()">${ICONS.plus} Update Stock</button>`)+skeletonRows();
  const [pj,ij]=await Promise.all([api('/products'),api('/inventory')]);
  const ps=pj.data||[],inv=ij.data||[]; const low=inv.filter(x=>x.stock<=(x.lowAt||10)).length;
  pg.innerHTML=pageHead('Inventory',`${low} products low on stock`,`<button class="btn btn-primary" onclick="invForm()">${ICONS.plus} Update Stock</button>`)+`
  <div class="panel"><div class="tbl-scroll"><table><thead><tr><th>Product</th><th>Stock</th><th>Alert At</th><th>Status</th></tr></thead><tbody>
  ${ps.map(p=>{const it=inv.find(x=>x.productId===p.id);const st=it?it.stock:0;const la=it?(it.lowAt||10):10;const isLow=st<=la;
    return `<tr><td><div class="cell-main">${p.name}</div><div class="cell-sub">₹${p.price}</div></td><td class="${isLow?'low-stock':'price'}">${st} units</td><td>${la}</td><td>${isLow?'<span class="badge b-red"><span class="dot"></span>Low stock</span>':'<span class="badge b-green"><span class="dot"></span>In stock</span>'}</td></tr>`;}).join('')}
  </tbody></table></div></div>`;
}
function invForm(){
  const ps=window._prods||[];
  openModal('Update Stock','Set inventory level for a product',
    `<div class="field"><label>Product</label><select id="if_pid" class="input" style="width:100%">${ps.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div class="mrow2">${F('if_stock','Stock units','number','0')}${F('if_low','Low alert at','number','10')}</div>`,
    async()=>{await api('/inventory','POST',{productId:gv('if_pid'),stock:+gv('if_stock'),lowAt:+gv('if_low')});closeModal();toast('Stock updated','success');rInv();});
}
