<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JeeOne Aqua — Admin Panel</title>
<style>
:root{--green:#1E5A3C;--dark:#123C28;--gold:#C9A227;--ivory:#F5F1E6;--white:#fff;--grey:#6b7280;--red:#dc2626;--line:#e5e7eb}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--ivory);color:#1f2937;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
/* ---------- LOGIN ---------- */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--dark),var(--green));padding:20px}
.login-card{background:var(--white);padding:36px 30px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:360px;max-width:94vw}
.login-card h1{color:var(--green);text-align:center;font-size:26px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:8px}
.login-card p{text-align:center;color:var(--grey);margin-bottom:24px;font-size:14px}
.login-card input{width:100%;padding:13px 15px;margin-bottom:14px;border:2px solid var(--line);border-radius:10px;font-size:15px;outline:none;transition:border .2s}
.login-card input:focus{border-color:var(--green)}
.login-card button.login-btn{width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.login-card button.login-btn:hover{background:var(--dark)}
.login-card button.login-btn:active{transform:scale(.98)}
#loginErr{color:var(--red);text-align:center;margin-top:12px;font-size:14px;display:none}
.pass-wrap{position:relative;margin-bottom:14px}
.pass-wrap input{margin-bottom:0;padding-right:48px}
.pass-wrap .pass-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;background:none;border:none;cursor:pointer;font-size:19px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.pass-wrap .pass-toggle:hover{background:#f3f4f6}
/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh}
.topbar{background:var(--dark);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.topbar .brand{font-size:19px;font-weight:800;color:var(--gold);display:flex;align-items:center;gap:8px}.topbar .brand svg{flex-shrink:0}
.topbar .brand small{color:#fff;font-weight:400;font-size:12px;opacity:.8}
.topbar .logout{background:transparent;border:1.5px solid var(--gold);color:var(--gold);padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.topbar .logout:active{background:var(--gold);color:var(--dark)}
.page{padding:16px 14px 90px;max-width:1100px;margin:0 auto}
.page h2{color:var(--dark);margin-bottom:14px;font-size:20px;display:flex;align-items:center;gap:8px}
/* ---------- CARDS ---------- */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--white);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05);border-left:4px solid var(--green)}
.card.gold{border-left-color:var(--gold)}
.card .num{font-size:26px;font-weight:800;color:var(--green)}
.card .lbl{color:var(--grey);font-size:12px;margin-top:4px}
/* ---------- TABLES ---------- */
.tbl-wrap{background:var(--white);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05);overflow-x:auto;margin-bottom:16px}
table{width:100%;border-collapse:collapse;min-width:520px}
th{background:var(--green);color:#fff;padding:11px 12px;text-align:left;font-size:12px;font-weight:700;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #f3f4f6;font-size:13px;vertical-align:middle}
tr:last-child td{border:none}
tr:active{background:#f9fafb}
/* ---------- BUTTONS ---------- */
.btn{padding:7px 13px;border-radius:8px;border:none;cursor:pointer;font-size:12.5px;font-weight:700;white-space:nowrap}
.btn-add{background:var(--green);color:#fff;padding:11px 20px;margin-bottom:14px;font-size:14px;border-radius:10px;box-shadow:0 2px 8px rgba(30,90,60,.3)}
.btn-add:active{transform:scale(.97)}
.btn-edit{background:#dbeafe;color:#1d4ed8;margin-right:6px}
.btn-del{background:#fee2e2;color:var(--red)}
.btn:active{opacity:.8}
.status{padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.st-Confirmed,.st-active{background:#dbeafe;color:#1d4ed8}
.st-Packed{background:#fef3c7;color:#92400e}
.st-Shipped{background:#e0e7ff;color:#3730a3}
.st-Delivered{background:#d1fae5;color:#065f46}
.st-Cancelled,.st-cancelled,.st-inactive{background:#fee2e2;color:#991b1b}
.st-paused{background:#fef3c7;color:#92400e}
/* ---------- BOTTOM NAV (mobile) ---------- */
.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--line);z-index:100;padding-bottom:env(safe-area-inset-bottom);overflow-x:auto;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.bottomnav button{flex:1;min-width:64px;border:none;background:none;padding:9px 4px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--grey);font-size:10px;font-weight:600}
.bottomnav button .ic{display:flex;align-items:center;justify-content:center}.bottomnav button .ic svg{width:22px;height:22px}.sidenav button svg{width:19px;height:19px;flex-shrink:0}
.bottomnav button.active{color:var(--green)}
.bottomnav button:active{background:#f3f4f6}
/* Desktop sidebar */
.sidenav{display:none}
@media(min-width:900px){
  .bottomnav{display:none}
  .shell{display:flex}
  .sidenav{display:block;width:220px;background:var(--white);border-right:1px solid var(--line);padding:14px 0;position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;flex-shrink:0}
  .sidenav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 20px;border:none;background:none;font-size:14px;cursor:pointer;color:#374151;border-left:3px solid transparent;font-weight:500}
  .sidenav button:hover{background:#f3f4f6}
  .sidenav button.active{background:#ecfdf5;color:var(--green);font-weight:700;border-left-color:var(--green)}
  .page{padding-bottom:30px}
}
/* ---------- MODAL ---------- */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
@media(min-width:700px){.modal{align-items:center}}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;animation:slideUp .25s ease}
@media(min-width:700px){.modal-box{border-radius:18px}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal-box h3{color:var(--dark);margin-bottom:16px;font-size:18px}
.modal-box label{display:block;font-size:12.5px;font-weight:700;color:#374151;margin:12px 0 5px}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:10px;font-size:14px;outline:none;background:#fff}
.modal-box input:focus,.modal-box select:focus,.modal-box textarea:focus{border-color:var(--green)}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.modal-btns button{flex:1;padding:13px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:14px}
.btn-save{background:var(--green);color:#fff}
.btn-cancel{background:#f3f4f6;color:#374151}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select.stsel{padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);font-size:12.5px;background:#fff;max-width:130px}
.tab{display:none}.tab.active{display:block;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.empty{padding:30px;text-align:center;color:var(--grey);font-size:14px}
.chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;background:#ecfdf5;color:var(--green);margin:2px}
.chip.warn{background:#fef3c7;color:#92400e}
.chip.danger{background:#fee2e2;color:#991b1b}
.settings-group{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.settings-group h3{color:var(--dark);font-size:15px;margin-bottom:12px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f3f4f6}
.toggle-row:last-child{border:none}
.toggle-row span{font-size:14px}
.switch{position:relative;width:48px;height:27px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#d1d5db;border-radius:27px;cursor:pointer;transition:.2s}
.slider:before{position:absolute;content:"";height:21px;width:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider:before{transform:translateX(21px)}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(min-width:700px){.report-grid{grid-template-columns:repeat(3,1fr)}}
.rpt{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.rpt h4{font-size:12px;color:var(--grey);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.rpt .big{font-size:24px;font-weight:800;color:var(--dark)}
.rpt .sub{font-size:13px;color:var(--grey);margin-top:4px}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1><svg width="26" height="26" viewBox="0 0 24 24" fill="#4FC3F7" style="vertical-align:-5px"><path d="M12 2s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg> JeeOne Aqua</h1>
    <p>Admin Panel</p>
    <input type="text" id="u" placeholder="Username" autocomplete="off">
    <div class="pass-wrap">
      <input type="password" id="p" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
      <button type="button" class="pass-toggle" onclick="togglePass()" id="passToggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button class="login-btn" onclick="doLogin()">Login</button>
    <div id="loginErr">Invalid username or password</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 24 24" fill="#4FC3F7" style="vertical-align:-5px"><path d="M12 2s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg> JeeOne Aqua <small>Admin</small></div>
    <button class="logout" onclick="logout()">Logout</button>
  </div>
  <div class="shell">
    <div class="sidenav" id="sidenav"></div>
    <div class="page">
      <div id="tab-dash" class="tab active"><h2>Dashboard</h2><div id="dashContent"></div></div>
      <div id="tab-products" class="tab"><h2>Products</h2><div id="prodContent"></div></div>
      <div id="tab-orders" class="tab"><h2>Orders</h2><div id="orderContent"></div></div>
      <div id="tab-subs" class="tab"><h2>Subscriptions</h2><div id="subsContent"></div></div>
      <div id="tab-slots" class="tab"><h2>Delivery Slots</h2><div id="slotsContent"></div></div>
      <div id="tab-boys" class="tab"><h2>Delivery Riders</h2><div id="boysContent"></div></div>
      <div id="tab-inventory" class="tab"><h2>Inventory</h2><div id="invContent"></div></div>
      <div id="tab-cats" class="tab"><h2>Categories</h2><div id="catsContent"></div></div>
      <div id="tab-banners" class="tab"><h2>Banners</h2><div id="bannersContent"></div></div>
      <div id="tab-customers" class="tab"><h2>Customers</h2><div id="custContent"></div></div>
      <div id="tab-coupons" class="tab"><h2>Coupons</h2><div id="couponContent"></div></div>
      <div id="tab-reviews" class="tab"><h2>Reviews</h2><div id="revContent"></div></div>
      <div id="tab-feedback" class="tab"><h2>Feedback</h2><div id="fbContent"></div></div>
      <div id="tab-reports" class="tab"><h2>Reports</h2><div id="rptContent"></div></div>
      <div id="tab-settings" class="tab"><h2>Settings</h2><div id="setContent"></div></div>
    </div>
  </div>
  <div class="bottomnav" id="bottomnav"></div>
</div>

<div class="modal" id="genModal"><div class="modal-box"><h3 id="gmTitle"></h3><div id="gmBody"></div><div class="modal-btns"><button class="btn-save" id="gmSave">Save</button><button class="btn-cancel" onclick="closeModal()">Cancel</button></div></div></div>

<script>
const API = location.pathname.includes('/jeeone') ? '/jeeone/api' : '/api';
let TOKEN = localStorage.getItem('jeeone_admin_token') || '';
const H = () => ({'Content-Type':'application/json','Authorization':'Bearer '+TOKEN});
async function api(path, method='GET', body){
  const r = await fetch(API+path,{method,headers:H(),body:body?JSON.stringify(body):undefined});
  const j = await r.json();
  if(j.error==='Auth required'){logout();throw new Error('auth');}
  return j;
}
function togglePass(){const p=document.getElementById('p'),t=document.getElementById('passToggle');if(p.type==='password'){p.type='text';t.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';}else{p.type='password';t.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';}}
async function doLogin(){
  const u=document.getElementById('u').value,p=document.getElementById('p').value;
  document.getElementById('loginErr').style.display='none';
  try{const j=await api('/admin/login','POST',{username:u,password:p});
    if(j.ok){TOKEN=j.data.token;localStorage.setItem('jeeone_admin_token',TOKEN);init();}
    else document.getElementById('loginErr').style.display='block';
  }catch(e){document.getElementById('loginErr').style.display='block';}
}
function logout(){localStorage.removeItem('jeeone_admin_token');TOKEN='';location.reload();}
function closeModal(){document.getElementById('genModal').classList.remove('show');}
function openModal(title, fieldsHtml, onSave){
  document.getElementById('gmTitle').textContent=title;
  document.getElementById('gmBody').innerHTML=fieldsHtml;
  document.getElementById('gmSave').onclick=onSave;
  document.getElementById('genModal').classList.add('show');
}
const F=(id,label,type='text',val='',extra='')=>`<label>${label}</label><input id="${id}" type="${type}" value="${val}" ${extra}>`;
const FA=(id,label,val='')=>`<label>${label}</label><textarea id="${id}" rows="2">${val}</textarea>`;
const FS=(id,label,opts,val='')=>`<label>${label}</label><select id="${id}">${opts.map(o=>`<option value="${o}" ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
const gv=id=>document.getElementById(id).value;

// Navigation
const NAV=[
  ['dash','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>','Dashboard'],['products','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22" x2="12" y2="12"/></svg>','Products'],['orders','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>','Orders'],
  ['subs','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>','Subs'],['slots','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>','Slots'],['boys','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"/></svg>','Riders'],
  ['inventory','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>','Stock'],['cats','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>','Cats'],['banners','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>','Banners'],
  ['customers','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>','Customers'],['coupons','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>','Coupons'],['reviews','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>','Reviews'],

function buildNav(){
  const bn=document.getElementById('bottomnav'), sn=document.getElementById('sidenav');
  bn.innerHTML=NAV.map(([k,ic,lb])=>`<button data-tab="${k}" onclick="goTab('${k}')"><span class="ic">${ic}</span>${lb}</button>`).join('');
  sn.innerHTML=NAV.map(([k,ic,lb])=>`<button data-tab="${k}" onclick="goTab('${k}')">${ic} ${lb}</button>`).join('');
}
function goTab(k){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+k).classList.add('active');
  document.querySelectorAll('#bottomnav button,#sidenav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===k));
  document.querySelector('.page').scrollTop=0; window.scrollTo(0,0);
  LOADERS[k]&&LOADERS[k]();
}

  document.getElementById('login').style.display='none';

    <div class="rpt"><h4>Today</h4><div class="big">₹${((s.today||{}).revenue||0).toLocaleString('en-IN')}</div><div class="sub">${(s.today||{}).orders||0} orders</div></div>

    <div class="rpt"><h4>All Time</h4><div class="big">₹${((s.all||{}).revenue||0).toLocaleString('en-IN')}</div><div class="sub">${(s.all||{}).orders||0} orders</div></div>
  </div>
  <h2>Orders by Status</h2>
  <div class="tbl-wrap"><table><thead><tr><th>Status</th><th>Count</th></tr></thead><tbody>
  ${Object.entries(bs).map(([k,v])=>`<tr><td><span class="status st-${k}">${k}</span></td><td><b>${v}</b></td></tr>`).join('')||'<tr><td colspan=2 class="empty">No data</td></tr>'}
  </tbody></table></div>`;
}

// ---- Settings ----
async function loadSettings(){
  const el=document.getElementById('setContent'); el.innerHTML='<div class="empty">Loading...</div>';
  const j=await api('/settings'); const s=j.data||{};
  el.innerHTML=`
  <div class="settings-group"><h3>Store</h3>
    ${F('set_name','Store Name','text',s.storeName||'')}
    <div class="row2">${F('set_fee','Delivery Fee ₹','number',s.deliveryFee||0)}${F('set_min','Min Order ₹','number',s.minOrder||0)}</div>
    ${F('set_free','Free delivery above ₹','number',s.freeAbove||199)}
  </div>
  <div class="settings-group"><h3>Support</h3>
    ${F('set_phone','Support Phone','text',s.supportPhone||'')}
    ${F('set_email','Support Email','text',s.supportEmail||'')}
  </div>
  <div class="settings-group"><h3>Payments</h3>
    <div class="toggle-row"><span>Cash on Delivery</span><label class="switch"><input type="checkbox" id="set_cod" ${s.codEnabled!==false?'checked':''}><span class="slider"></span></label></div>
    <div class="toggle-row"><span>Online Payment</span><label class="switch"><input type="checkbox" id="set_online" ${s.onlineEnabled!==false?'checked':''}><span class="slider"></span></label></div>
  </div>
  <button class="btn btn-add" style="width:100%" onclick="saveSettings()">Save Settings</button>`;
}
async function saveSettings(){
  const body={storeName:gv('set_name'),deliveryFee:+gv('set_fee'),minOrder:+gv('set_min'),freeAbove:+gv('set_free'),
    supportPhone:gv('set_phone'),supportEmail:gv('set_email'),
    codEnabled:document.getElementById('set_cod').checked,onlineEnabled:document.getElementById('set_online').checked};
  await api('/settings','PUT',body); alert('Settings saved!');
}

const LOADERS={dash:loadDash,products:loadProducts,orders:loadOrders,subs:loadSubs,slots:loadSlots,boys:loadBoys,inventory:loadInv,cats:loadCats,banners:loadBanners,customers:loadCust,coupons:loadCoupons,reviews:loadReviews,feedback:loadFeedback,reports:loadReports,settings:loadSettings};

if(TOKEN) init();
</script>
